<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Gás & Água - Pedido Rapido</title>

    <!-- Link Bonito -->
         
    <meta property="og:title" content="Disk Gás & Água - Faça seu pedido online!">
    <meta property="og:description" content="Entregas rápidas de botijão de gás e galão de água. Peça direto pelo WhatsApp!">
    <meta property="og:type" content="website">


    <!-- Icone -->
    <link rel="shortcut icon" href="#">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">


    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-notification" class="toast hidden">Produto adicionado! </div>

    <div class="container">
        <p>Faça seu pedido online sem complicação!</p>
    </header>

    <main>
        <!-- Produtos -->
         <section class="produtos">
            <div class="card-produto">
                <h2> Botijão de Gás (13kg)</h2>
                <p class="preco">R$ <span id="precoGas">135.00</span></p>
                <div class="quantidade">
                    <button type="button" class="btn-qtd" onclick="alterarQtd('gas', -1)" aria-label="Diminuir quantidade">-</button>
                    <!-- Adicionamos inputmode e pattern para forçar teclado numerico -->
                    <span id="qtdGas" class="qtd-display" inputmode="numeric" pattern="[0-9]*">0</span>
                    <button type="button" class="btn-qtd" onclick="alterarQtd('gas', 1)" aria-label="Aumentar quantidade">+</button>
            </div>
        </div>

        <div class="card-produto">
            <h2> Galão de Água (20L)</h2>
            <p class="preco">R$ <span id="precoAgua">20.00</span></p>
            <div class="quantidade">
                <button type="button" class="btn-qtd" onclick="alterarQtd('agua', -1)" aria-label="Diminuir quantidade">-</button>
                <!-- Adicionamos inputmode pra forçar teclado numerico -->
                <span id="qtdAgua" class="qtd-display" inputmode="numeric" pattern="[0-9]*">0</span>
                <button type="button" class="btn-qtd" onclick="alterarQtd('agua', 1)" aria-label="Aumentar quantidade">+</button>
            </div>
        </div>
    </section>


    <!-- Formulário de Entrega -->
    <section class="form-entrega">
        <h2>Dados para Entrega</h2>

        <label for="nome">Seu Nome *:</label>
        <input type="text" id="nome" placeholder="Ex: João Silva" required>

        <label for="endereco">Endereço completo e Nº *:</label>
        <input type="text" id="endereco" placeholder="Ex: Rua das Flores, 123 - Bairro Centro" required>

        <label for="pagamento">Forma de Pagamento:</label>
        <select id="pagamento">
            <option value="Pix">Pix</option>
            <option value="Cartao de Débito">Cartão de Débito</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="Dinheiro">Dinheiro</option>
        </select>

        <label for="observacao">Observações (ex: Troco para R$ 200):</label>
        <input type="text" id="observacao" placeholder="Opcional">
    </section>

    <!-- Resumo do Pedido -->
     <footer class="resumo">
        <div class="total-box">
            <span>Total:</span>
            <strong>R$ <span id="totalPedido">0.00</span></strong>
        </div>
        <button id="btnEnviar" onclick="enviarPedido()"> Confirmar e Enviar no WhatsApp</button>
    </footer>
</main>
</div>
