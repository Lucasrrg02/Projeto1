<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Gás e Água</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        
        .header-info { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
        .logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        h1 { font-size: 20px; color: #333; margin: 0; }
        
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 12px; text-align: center; }
        .aberto { background-color: #28a745; }
        .fechado { background-color: #dc3545; }

        .aviso-box { background-color: #e7f5ff; color: #0056b3; border: 1px solid #bbeeef; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; }

        .produto-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .produto-nome { font-weight: bold; color: #333; font-size: 14px; }
        .produto-preco { color: #28a745; font-size: 16px; font-weight: bold; }
        
        .qtd-selector { display: flex; align-items: center; gap: 8px; }
        .qtd-btn { width: 28px; height: 28px; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .qtd-val { font-weight: bold; width: 20px; text-align: center; }

        /* Caixa do Valor Total */
        .total-box { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .total-label { font-weight: bold; color: #3730a3; font-size: 15px; }
        .total-valor { color: #16a34a; font-size: 18px; font-weight: bold; }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        textarea { resize: vertical; height: 60px; }

        .btn-enviar { width: 100%; background-color: #25d366; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-enviar:hover { background-color: #1ebc57; }
        .btn-desativado { background-color: #6c757d; cursor: not-allowed; }

        #erro { color: #dc3545; font-weight: bold; display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <div id="conteudo-loja">
            <div class="header-info">
                <img id="imgLogo" src="https://via.placeholder.com/60" alt="Logo" class="logo">
                <h1 id="nomeLoja">Carregando...</h1>
            </div>

            <div style="text-align: center;">
                <div id="statusBadge" class="status-badge aberto">Carregando...</div>
            </div>

            <div id="avisoLoja" class="aviso-box"></div>

            <!-- Produto Gás -->
            <div id="boxGas" class="produto-box" style="display: none;">
                <div>
                    <div id="nomeGas" class="produto-nome">🔥 Botijão de gás 13kg</div>
                    <div id="precoGas" class="produto-preco">R$ --,--</div>
                </div>
                <div class="qtd-selector">
                    <button class="qtd-btn" onclick="alterarQtd('gas', -1)">-</button>
                    <span id="qtdGas" class="qtd-val">0</span>
                    <button class="qtd-btn" onclick="alterarQtd('gas', 1)">+</button>
                </div>
            </div>

            <!-- Produto Água -->
            <div id="boxAgua" class="produto-box" style="display: none;">
                <div>
                    <div id="nomeAgua" class="produto-nome">💧 Galão de água 20L</div>
                    <div id="precoAgua" class="produto-preco">R$ --,--</div>
                </div>
                <div class="qtd-selector">
                    <button class="qtd-btn" onclick="alterarQtd('agua', -1)">-</button>
                    <span id="qtdAgua" class="qtd-val">0</span>
                    <button class="qtd-btn" onclick="alterarQtd('agua', 1)">+</button>
                </div>
            </div>

            <!-- Total calculado dinamicamente -->
            <div class="total-box">
                <div class="total-label">Total do pedido</div>
                <div id="valorTotal" class="total-valor">R$ 0,00</div>
            </div>

            <!-- Formulário de entrega do cliente -->
            <form id="formPedido" onsubmit="enviarPedido(event)">
                <div class="form-group">
                    <label>Seu nome</label>
                    <input type="text" id="clienteNome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label>Endereço de entrega</label>
                    <input type="text" id="clienteEndereco" required placeholder="Rua, número e bairro">
                </div>

                <div class="form-group">
                    <label>Forma de pagamento</label>
                    <select id="formaPagamento" required>
                        <option value="">Selecione...</option>
                        <option value="Pix">Pix</option>
                        <option value="Cartão de crédito/débito">Cartão de crédito / débito</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Observação / troco</label>
                    <textarea id="clienteObs" placeholder="Ex: Precisa de troco para R$ 100,00 ou ponto de referência"></textarea>
                </div>

                <button type="submit" id="btnEnviar" class="btn-enviar">Pedir pelo WhatsApp</button>
            </form>
        </div>

        <div id="erro">Distribuidora não encontrada.</div>
    </div>

    <script>
        const API_URL = "https://disk-gas-api.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const lojaSlug = urlParams.get('loja') || 'padrao';

        let dadosLoja = null;
        let qtds = { gas: 0, agua: 0 };
        let lojaAbertaAgora = false;

        function atualizarTotal() {
            if (!dadosLoja) return;
            const totalGas = dadosLoja.vende_gas ? (qtds.gas * dadosLoja.preco_gas) : 0;
            const totalAgua = dadosLoja.vende_agua ? (qtds.agua * dadosLoja.preco_agua) : 0;
            const total = totalGas + totalAgua;
            document.getElementById('valorTotal').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function alterarQtd(tipo, val) {
            if (qtds[tipo] + val >= 0) {
                qtds[tipo] += val;
                document.getElementById(tipo === 'gas' ? 'qtdGas' : 'qtdAgua').textContent = qtds[tipo];
                atualizarTotal();
            }
        }

        function verificarHorarioFuncionamento(abertura, fechamento) {
            const agora = new Date();
            const [hAbre, mAbre] = abertura.split(':').map(Number);
            const [hFecha, mFecha] = fechamento.split(':').map(Number);

            const minutosAtuais = agora.getHours() * 60 + agora.getMinutes();
            const minutosAbertura = hAbre * 60 + mAbre;
            const minutosFechamento = hFecha * 60 + mFecha;

            if (minutosFechamento < minutosAbertura) {
                return minutosAtuais >= minutosAbertura || minutosAtuais < minutosFechamento;
            }

            return minutosAtuais >= minutosAbertura && minutosAtuais < minutosFechamento;
        }

        async function carregarLoja() {
            try {
                const response = await fetch(`${API_URL}/api/${lojaSlug}/precos`);
                if (!response.ok) throw new Error("Erro ao carregar dados");

                dadosLoja = await response.json();

                document.getElementById('nomeLoja').textContent = dadosLoja.nome;

                if (dadosLoja.logo_url) {
                    document.getElementById('imgLogo').src = dadosLoja.logo_url;
                }

                // Exibe ou esconde o card do Gás
                if (dadosLoja.vende_gas !== false) {
                    document.getElementById('boxGas').style.display = 'flex';
                    document.getElementById('nomeGas').textContent = `🔥 ${dadosLoja.nome_gas || 'Botijão de gás 13kg'}`;
                    document.getElementById('precoGas').textContent = `R$ ${dadosLoja.preco_gas.toFixed(2).replace('.', ',')}`;
                } else {
                    document.getElementById('boxGas').style.display = 'none';
                }

                // Exibe ou esconde o card da Água
                if (dadosLoja.vende_agua !== false) {
                    document.getElementById('boxAgua').style.display = 'flex';
                    document.getElementById('nomeAgua').textContent = `💧 ${dadosLoja.nome_agua || 'Galão de água 20L'}`;
                    document.getElementById('precoAgua').textContent = `R$ ${dadosLoja.preco_agua.toFixed(2).replace('.', ',')}`;
                } else {
                    document.getElementById('boxAgua').style.display = 'none';
                }

                const avisoBox = document.getElementById('avisoLoja');
                if (dadosLoja.aviso_loja && dadosLoja.aviso_loja.trim() !== '') {
                    avisoBox.textContent = `📢 ${dadosLoja.aviso_loja}`;
                    avisoBox.style.display = 'block';
                }

                const badge = document.getElementById('statusBadge');
                const btn = document.getElementById('btnEnviar');

                const hAbre = dadosLoja.horario_abertura || '07:00';
                const hFecha = dadosLoja.horario_fechamento || '18:00';
                const dentroDoHorario = verificarHorarioFuncionamento(hAbre, hFecha);

                if (dadosLoja.status_loja && dentroDoHorario) {
                    lojaAbertaAgora = true;
                    badge.textContent = "Aberto";
                    badge.className = "status-badge aberto";
                } else {
                    lojaAbertaAgora = false;
                    badge.textContent = "Fechado";
                    badge.className = "status-badge fechado";
                    btn.textContent = `Loja fechada (${hAbre} às ${hFecha})`;
                    btn.classList.add('btn-desativado');
                    btn.disabled = true;
                }

                atualizarTotal();

            } catch (err) {
                document.getElementById('conteudo-loja').style.display = 'none';
                document.getElementById('erro').style.display = 'block';
            }
        }

        function enviarPedido(e) {
            e.preventDefault();

            if (!lojaAbertaAgora) return;

            if (qtds.gas === 0 && qtds.agua === 0) {
                alert("Por favor, adicione pelo menos 1 item ao seu pedido.");
                return;
            }

            const nome = document.getElementById('clienteNome').value.trim();
            const endereco = document.getElementById('clienteEndereco').value.trim();
            const pagamento = document.getElementById('formaPagamento').value;
            const obs = document.getElementById('clienteObs').value.trim();

            let itens = [];
            let total = 0;

            if (dadosLoja.vende_gas && qtds.gas > 0) {
                const subTotalGas = qtds.gas * dadosLoja.preco_gas;
                const nomeGasExibicao = dadosLoja.nome_gas || 'Botijão de gás 13kg';
                itens.push(`• *${qtds.gas}x* ${nomeGasExibicao} (R$ ${subTotalGas.toFixed(2)})`);
                total += subTotalGas;
            }

            if (dadosLoja.vende_agua && qtds.agua > 0) {
                const subTotalAgua = qtds.agua * dadosLoja.preco_agua;
                const nomeAguaExibicao = dadosLoja.nome_agua || 'Galão de água 20L';
                itens.push(`• *${qtds.agua}x* ${nomeAguaExibicao} (R$ ${subTotalAgua.toFixed(2)})`);
                total += subTotalAgua;
            }

            let msg = `🛒 *Novo pedido - ${dadosLoja.nome}*\n\n`;
            msg += `*Itens do pedido:*\n${itens.join('\n')}\n\n`;
            msg += `💰 *Valor total:* R$ ${total.toFixed(2)}\n\n`;
            msg += `👤 *Cliente:* ${nome}\n`;
            msg += `📍 *Endereço:* ${endereco}\n`;
            msg += `💳 *Pagamento:* ${pagamento}\n`;

            if (obs !== '') {
                msg += `📝 *Obs:* ${obs}\n`;
            }

            const urlWhatsapp = `https://wa.me/${dadosLoja.whatsapp}?text=${encodeURIComponent(msg)}`;
            window.open(urlWhatsapp, '_blank');
        }

        carregarLoja();
    </script>
</body>
</html>
