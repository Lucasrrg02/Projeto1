<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Gás e Água</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        
        .header-info { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        h1 { font-size: 22px; color: #333; margin: 0; }
        
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 15px; }
        .aberto { background-color: #28a745; }
        .fechado { background-color: #dc3545; }

        /* Banner de Aviso Personalizado */
        .aviso-box { background-color: #e7f5ff; color: #0056b3; border: 1px solid #bbeeef; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 20px; display: none; }

        .produto { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .produto-info { text-align: left; }
        .produto-nome { font-weight: bold; color: #333; }
        .produto-preco { color: #28a745; font-size: 18px; font-weight: bold; margin-top: 5px; }
        
        .btn-whatsapp { background-color: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn-whatsapp:hover { background-color: #1ebc57; }
        .btn-desativado { background-color: #6c757d; cursor: not-allowed; pointer-events: none; }

        #erro { color: #dc3545; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div id="conteudo-loja">
            <div class="header-info">
                <img id="imgLogo" src="https://via.placeholder.com/60" alt="Logo" class="logo">
                <h1 id="nomeLoja">Carregando...</h1>
            </div>

            <div id="statusBadge" class="status-badge aberto">Carregando...</div>

            <!-- Aviso da Distribuidora (Ex: Aberto das 7h as 18h) -->
            <div id="avisoLoja" class="aviso-box"></div>

            <div class="produto">
                <div class="produto-info">
                    <div class="produto-nome">Botijão de Gás 13kg</div>
                    <div id="precoGas" class="produto-preco">R$ --,--</div>
                </div>
                <a id="btnGas" href="#" target="_blank" class="btn-whatsapp">Pedir Gás</a>
            </div>

            <div class="produto">
                <div class="produto-info">
                    <div class="produto-nome">Galão de Água 20L</div>
                    <div id="precoAgua" class="produto-preco">R$ --,--</div>
                </div>
                <a id="btnAgua" href="#" target="_blank" class="btn-whatsapp">Pedir Água</a>
            </div>
        </div>

        <div id="erro">Distribuidora não encontrada.</div>
    </div>

    <script>
        const API_URL = "https://disk-gas-api.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const lojaSlug = urlParams.get('loja') || 'padrao';

        async function carregarLoja() {
            try {
                const response = await fetch(`${API_URL}/api/${lojaSlug}/precos`);
                if (!response.ok) throw new Error("Erro ao carregar dados");

                const data = await response.json();

                document.getElementById('nomeLoja').textContent = data.nome;
                document.getElementById('precoGas').textContent = `R$ ${data.preco_gas.toFixed(2)}`;
                document.getElementById('precoAgua').textContent = `R$ ${data.preco_agua.toFixed(2)}`;

                if (data.logo_url) {
                    document.getElementById('imgLogo').src = data.logo_url;
                }

                // Aviso Personalizado
                const avisoBox = document.getElementById('avisoLoja');
                if (data.aviso_loja && data.aviso_loja.trim() !== '') {
                    avisoBox.textContent = `📢 ${data.aviso_loja}`;
                    avisoBox.style.display = 'block';
                }

                // Status de Aberto / Fechado
                const badge = document.getElementById('statusBadge');
                const btnGas = document.getElementById('btnGas');
                const btnAgua = document.getElementById('btnAgua');

                if (data.status_loja) {
                    badge.textContent = "ABERTO";
                    badge.className = "status-badge aberto";

                    const msgGas = encodeURIComponent(`Olá! Gostaria de pedir um Botijão de Gás (R$ ${data.preco_gas.toFixed(2)})`);
                    const msgAgua = encodeURIComponent(`Olá! Gostaria de pedir um Galão de Água (R$ ${data.preco_agua.toFixed(2)})`);

                    btnGas.href = `https://wa.me/${data.whatsapp}?text=${msgGas}`;
                    btnAgua.href = `https://wa.me/${data.whatsapp}?text=${msgAgua}`;
                } else {
                    badge.textContent = "FECHADO";
                    badge.className = "status-badge fechado";

                    btnGas.textContent = "Fechado";
                    btnGas.classList.add('btn-desativado');
                    btnAgua.textContent = "Fechado";
                    btnAgua.classList.add('btn-desativado');
                }

            } catch (err) {
                document.getElementById('conteudo-loja').style.display = 'none';
                document.getElementById('erro').style.display = 'block';
            }
        }

        carregarLoja();
    </script>
</body>
</html>
