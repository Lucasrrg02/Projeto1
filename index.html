<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Gás & Água - Pedido Rapido</title>

    <!-- Link Bonito -->
         
    <meta property="og:title" content="Disk Gás & Água - Faça seu pedido online!">
    <meta property="og:description" content="Entregas rápidas de botijão de gás e galão de água. Peça direto pelo WhatsApp!">
    <meta property="og:type" content="website">


    <!-- Icone -->
    <link rel="shortcut icon" href="#">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">


    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-notification" class="toast hidden">Produto adicionado! </div>

    <div class="container">
    <header>
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
            <!-- Imagem da Logo -->
            <img id="imgLogo" src="" alt="Logo" style="max-height: 48px; display: none; border-radius: 6px; object-fit: contain;">
            <h1 id="nomeLoja">Disk Gás e Água</h1>
        </div>
        <p>Faça seu pedido online sem complicação!</p>
    </header>

    <main>
        <!-- Produtos -->
         <section class="produtos">
            <div class="card-produto">
                <h2> Botijão de Gás (13kg)</h2>
                <p class="preco">R$ <span id="precoGas">135.00</span></p>
                <div class="quantidade">
                    <button type="button" class="btn-qtd" onclick="alterarQtd('gas', -1)" aria-label="Diminuir quantidade">-</button>
                    <!-- Adicionamos inputmode e pattern para forçar teclado numerico -->
                    <span id="qtdGas" class="qtd-display" inputmode="numeric" pattern="[0-9]*">0</span>
                    <button type="button" class="btn-qtd" onclick="alterarQtd('gas', 1)" aria-label="Aumentar quantidade">+</button>
            </div>
        </div>

        <div class="card-produto">
            <h2> Galão de Água (20L)</h2>
            <p class="preco">R$ <span id="precoAgua">20.00</span></p>
            <div class="quantidade">
                <button type="button" class="btn-qtd" onclick="alterarQtd('agua', -1)" aria-label="Diminuir quantidade">-</button>
                <!-- Adicionamos inputmode pra forçar teclado numerico -->
                <span id="qtdAgua" class="qtd-display" inputmode="numeric" pattern="[0-9]*">0</span>
                <button type="button" class="btn-qtd" onclick="alterarQtd('agua', 1)" aria-label="Aumentar quantidade">+</button>
            </div>
        </div>
    </section>


    <!-- Formulário de Entrega -->
    <section class="form-entrega">
        <h2>Dados para Entrega</h2>

        <label for="nome">Seu Nome *:</label>
        <input type="text" id="nome" placeholder="Ex: João Silva" required>

        <label for="endereco">Endereço completo e Nº *:</label>
        <input type="text" id="endereco" placeholder="Ex: Rua das Flores, 123 - Bairro Centro" required>

        <label for="pagamento">Forma de Pagamento:</label>
        <select id="pagamento">
            <option value="Pix">Pix</option>
            <option value="Cartao de Débito">Cartão de Débito</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="Dinheiro">Dinheiro</option>
        </select>

        <label for="observacao">Observações (ex: Troco para R$ 200):</label>
        <input type="text" id="observacao" placeholder="Opcional">
    </section>

    <!-- Resumo do Pedido -->
     <footer class="resumo">
        <div class="total-box">
            <span>Total:</span>
            <strong>R$ <span id="totalPedido">0.00</span></strong>
        </div>
        <button id="btnEnviar" onclick="enviarPedido()"> Confirmar e Enviar no WhatsApp</button>
    </footer>
</main>

<!-- 1. Botao para abrir a area do admin -->
    <footer style="text-align: center; margin-top: 30px; margin-bottom: 20px;">
        <button onclick="abrirModalAdmin()" style="background: none; border: none; color: #888; cursor: pointer; font-size: 12px; text-decoration: underline;">
            Área do Administrador
        </button>
    </footer>

</div>

<!-- O bloco inteiro do modal admin -->
 <div id="modalAdmin" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 320px; text-align: center;">
        <h3 style="margin-top: 0; color: #333;">Atualizar Preços</h3>


    <input type="password" id="senhaAdmin" placeholder="Senha do Admin" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
    <input type="number" step="0.01" id="novoPrecoGas" placeholder="Preço do Gás (R$)" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
    <input type="number" step="0.01" id="novoPrecoAgua" placeholder="Preço da Água (R$)" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">

    <div style="display: flex; gap: 10px;">
        <button onclick="salvarNovosPrecos()" style="flex: 1; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Salvar</button>
        <button onclick="fecharModalAdmin()" style="flex: 1; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Cancelar</button>
    </div>
</div>
</div>



<script src="app.js"></script>

</body>
</html>
